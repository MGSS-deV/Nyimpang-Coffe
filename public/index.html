<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyimpang Coffee — Self Ordering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-20">

    <!-- HEADER / NAVBAR -->
    <header class="bg-[var(--surface)] border-b border-[var(--border)] sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-6 py-5 flex justify-between items-center">
            <div>
                <h1 class="font-display text-xl tracking-tight" style="color: var(--text)">Nyimpang Coffee</h1>
                <p class="text-[11px] text-[var(--text-muted)] mt-0.5">Self Ordering</p>
            </div>
            <button onclick="toggleCartModal(true)" class="btn-ghost px-4 py-2 text-sm flex items-center gap-2">
                Keranjang
                <span id="cart-badge" class="badge-accent w-5 h-5 rounded-full text-[11px] flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- PELACAK STATUS PESANAN REALTIME -->
    <div id="order-tracker" class="hidden max-w-4xl mx-auto px-6 pt-8">
        <div class="surface-card p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-[11px] tracking-wide text-[var(--text-muted)] uppercase">Pesanan Aktif</p>
                    <h3 id="tracker-order-id" class="font-display text-base mt-0.5">-</h3>
                </div>
                <span id="tracker-status-badge" class="badge-accent text-[11px] px-3 py-1.5 rounded-full">Masuk</span>
            </div>
            <div class="flex items-center">
                <div class="flex-1 text-center">
                    <div id="step-masuk" class="w-2.5 h-2.5 mx-auto rounded-full dot-accent-full"></div>
                    <p class="text-[10px] mt-2 text-[var(--text-muted)]">Masuk</p>
                </div>
                <div class="flex-1 h-px bg-[var(--border)]"></div>
                <div class="flex-1 text-center">
                    <div id="step-dibuat" class="w-2.5 h-2.5 mx-auto rounded-full bg-[var(--border)]"></div>
                    <p class="text-[10px] mt-2 text-[var(--text-muted)]">Dibuat</p>
                </div>
                <div class="flex-1 h-px bg-[var(--border)]"></div>
                <div class="flex-1 text-center">
                    <div id="step-siap" class="w-2.5 h-2.5 mx-auto rounded-full bg-[var(--border)]"></div>
                    <p class="text-[10px] mt-2 text-[var(--text-muted)]">Siap Diambil</p>
                </div>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA MENU -->
    <main class="max-w-4xl mx-auto px-6 py-10">
        <div class="mb-8">
            <p class="text-[11px] tracking-wide text-[var(--text-muted)] uppercase mb-1">Menu</p>
            <h2 class="font-display text-2xl">Daftar Favorit Kami</h2>
        </div>

        <!-- Diisi otomatis oleh app.js lewat fetch('/api/products') -->
        <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-xs col-span-full" style="color: var(--text-faint)">Memuat menu...</p>
        </div>
    </main>

    <!-- MODAL KERANJANG -->
    <div id="cart-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex justify-end">
        <div class="bg-[var(--surface)] w-full max-w-sm h-full p-6 flex flex-col justify-between overflow-y-auto border-l border-[var(--border)]">
            <div>
                <div class="flex justify-between items-center pb-4 mb-2 hairline-divider pt-0">
                    <h2 class="font-display text-lg">Keranjang</h2>
                    <button onclick="toggleCartModal(false)" class="text-[var(--text-muted)] hover:text-[var(--text)] text-xl leading-none cursor-pointer">&times;</button>
                </div>
                <div id="cart-items-container" class="py-3 space-y-2"></div>
            </div>

            <div class="hairline-divider pt-4">
                <form id="checkout-form" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Nama Pemesan</label>
                        <input type="text" id="customer-name" required class="w-full bg-[var(--bg)] border border-[var(--border)] rounded-[var(--radius-sm)] px-3 py-2 text-xs focus:outline-none focus:border-[var(--accent)]" placeholder="Masukkan nama...">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">No. WhatsApp <span style="color: var(--text-faint)">(opsional)</span></label>
                        <input type="tel" id="customer-phone" class="w-full bg-[var(--bg)] border border-[var(--border)] rounded-[var(--radius-sm)] px-3 py-2 text-xs focus:outline-none focus:border-[var(--accent)]" placeholder="08xxxxxxxxxx">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Tipe Pesanan</label>
                            <select id="order-type" class="w-full bg-[var(--bg)] border border-[var(--border)] rounded-[var(--radius-sm)] px-3 py-2 text-xs focus:outline-none focus:border-[var(--accent)]">
                                <option value="Dine In">Dine In</option>
                                <option value="Take Away">Take Away</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Nomor Meja</label>
                            <input type="text" id="table-number" required class="w-full bg-[var(--bg)] border border-[var(--border)] rounded-[var(--radius-sm)] px-3 py-2 text-xs focus:outline-none focus:border-[var(--accent)]" placeholder="Cth: 12">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Metode Pembayaran</label>
                        <select id="payment-method" class="w-full bg-[var(--bg)] border border-[var(--border)] rounded-[var(--radius-sm)] px-3 py-2 text-xs focus:outline-none focus:border-[var(--accent)]">
                            <option value="QRIS">QRIS All Payment</option>
                            <option value="DANA">DANA (Auto Nominal)</option>
                            <option value="Kasir / Cash">Bayar di Kasir (Cash)</option>
                        </select>
                    </div>

                    <div class="flex justify-between items-center pt-2 text-sm">
                        <span class="text-[var(--text-muted)]">Total</span>
                        <span id="cart-total-price" class="font-display text-base" style="color: var(--accent-dark)">Rp 0</span>
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 text-xs">
                        Pesan Sekarang
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL PEMBAYARAN MANUAL -->
    <div id="payment-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="surface-card w-full max-w-sm p-6 text-center space-y-4">
            <h3 id="pay-title" class="font-display text-lg">Selesaikan Pembayaran</h3>
            <p class="text-xs text-[var(--text-muted)]">Total yang harus dibayar</p>
            <div id="pay-total" class="font-display text-xl" style="color: var(--accent-dark)">Rp 0</div>

            <div id="pay-content" class="p-4 rounded-[var(--radius-sm)] flex flex-col items-center justify-center space-y-3" style="background: var(--bg); border: 1px solid var(--border)">
                <!-- Konten dinamis dari JS -->
            </div>

            <p class="text-[11px] text-[var(--text-muted)]">Selesaikan pembayaran, lalu konfirmasi agar pesanan langsung masuk ke Barista.</p>

            <button onclick="confirmPayment()" class="btn-primary w-full py-3 text-xs">
                Saya Sudah Bayar
            </button>
        </div>
    </div>

    <!-- Script JavaScript Klien -->
    <script src="app.js"></script>
</body>
</html>
